name: CI

on:
  push:
    branches: [main]
  pull_request:

# Mínimo privilegio: el workflow solo lee el repositorio.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Acciones fijadas por commit (no por etiqueta) para evitar cambios silenciosos en la cadena de suministro.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # historial completo: el escáner revisa todos los commits
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - name: Auditoría de dependencias de producción
        # high: los hallazgos moderados aceptados están documentados en SECURITY.md («Hallazgos aceptados»).
        run: npm audit --omit=dev --audit-level=high
      - name: Firmas y procedencia de los paquetes del registro
        run: npm audit signatures
      - name: SBOM CycloneDX de las dependencias de producción
        run: npm sbom --omit=dev --sbom-format=cyclonedx --sbom-type=application > sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90
      - name: Escáner del código completo (credenciales, direcciones; los términos de clientes solo existen en local)
        run: node scripts/scan-sensitive.mjs
      - name: Escáner de todo el historial (todas las ramas)
        run: node scripts/scan-sensitive.mjs --history
      - name: La documentación generada está al día
        run: node dist/scripts/gen-docs.js && git diff --exit-code -- README.md README.es.md docs/TOOLS.md
