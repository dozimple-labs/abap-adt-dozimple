name: Release

# Publica en npm con procedencia (trusted publishing, OIDC: sin tokens guardados) y crea la release firmada de
# GitHub. Solo al crear un tag vX.Y.Z; la publicación espera la aprobación manual del environment «release».
on:
  push:
    tags: ["v*"]

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # firma de la atestación de procedencia (Sigstore)
      attestations: write
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      dist_tag: ${{ steps.version.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: El tag coincide con la versión de package.json
        id: version
        run: |
          v="$(node -p "require('./package.json').version")"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "El tag $GITHUB_REF_NAME no coincide con package.json ($v)"; exit 1; }
          case "$v" in *-*) echo "dist_tag=next" >> "$GITHUB_OUTPUT";; *) echo "dist_tag=latest" >> "$GITHUB_OUTPUT";; esac
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm audit signatures
      - run: node scripts/scan-sensitive.mjs
      - name: Empaquetar
        id: pack
        run: |
          npm pack --ignore-scripts
          echo "tarball=$(ls dozimple-abap-adt-*.tgz)" >> "$GITHUB_OUTPUT"
      - run: npm sbom --omit=dev --sbom-format=cyclonedx --sbom-type=application > sbom.cdx.json
      - name: Atestación de procedencia del paquete
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}
      - name: Adjuntar el bundle de la atestación con los dos nombres
        # Es el mismo bundle in-toto: `.sigstore.json` es el nombre que verifica `gh attestation verify`
        # y `.intoto.jsonl` el que reconocen como procedencia las herramientas de cadena de suministro.
        run: |
          cp "${{ steps.attest.outputs.bundle-path }}" "${{ steps.pack.outputs.tarball }}.sigstore.json"
          cp "${{ steps.attest.outputs.bundle-path }}" "${{ steps.pack.outputs.tarball }}.intoto.jsonl"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release
          path: |
            ${{ steps.pack.outputs.tarball }}
            ${{ steps.pack.outputs.tarball }}.sigstore.json
            ${{ steps.pack.outputs.tarball }}.intoto.jsonl
            sbom.cdx.json
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release # aprobación manual; solo tags v*
    permissions:
      contents: write # crear la release de GitHub
      id-token: write # trusted publishing en npm (OIDC) y procedencia
    steps:
      # Node 24 trae npm >= 11.5.1, que es lo que exige el trusted publishing: así no hay que instalar npm aparte
      # (una instalación global no se puede fijar por hash). El build sigue en 22, la versión mínima que soportamos.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: npm admite trusted publishing (>= 11.5.1)
        run: |
          v="$(npm -v)"; echo "npm $v"
          [ "$(printf '11.5.1\n%s\n' "$v" | sort -V | head -1)" = "11.5.1" ] || { echo "npm $v es anterior a 11.5.1: la publicación por OIDC no funcionaría."; exit 1; }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release
      - name: Publicar en npm con procedencia
        # Repetible: si esa versión ya está publicada (reintento de un run), no se vuelve a publicar.
        run: |
          v="${GITHUB_REF_NAME#v}"
          if npm view "@dozimple/abap-adt@$v" version >/dev/null 2>&1; then
            echo "@dozimple/abap-adt@$v ya está en npm: no se republica."
          else
            npm publish "${{ needs.build.outputs.tarball }}" --provenance --access public --tag "${{ needs.build.outputs.dist_tag }}"
          fi
      - name: Comprobar etiquetas de npm
        # npm procesa cada versión antes de hacerla visible («Your package is being processed»): puede tardar varios
        # minutos. Se reintenta hasta 10 antes de fallar; con la 1.3.0 no bastaron 2.
        run: |
          v="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 60); do
            tag="$(npm view @dozimple/abap-adt dist-tags.${{ needs.build.outputs.dist_tag }} 2>/dev/null || true)"
            [ "$tag" = "$v" ] && { npm view @dozimple/abap-adt dist-tags; exit 0; }
            echo "dist-tag ${{ needs.build.outputs.dist_tag }} = ${tag:-?}, se espera $v (intento $i/60)"; sleep 10
          done
          echo "La etiqueta no apunta a $v tras 10 minutos."; exit 1
      - name: Release de GitHub con paquete, atestación y SBOM
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=(
            "${{ needs.build.outputs.tarball }}"
            "${{ needs.build.outputs.tarball }}.sigstore.json"
            "${{ needs.build.outputs.tarball }}.intoto.jsonl"
            sbom.cdx.json
          )
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber "${files[@]}"
          else
            pre=""; [ "${{ needs.build.outputs.dist_tag }}" = next ] && pre="--prerelease"
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes $pre "${files[@]}"
          fi
